repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        exclude: ^alembic/versions/
     
      - id: mypy
        name: mypy type checking
        entry: uv run mypy src tests alembic/env.py
        language: system
        types: [python]
        pass_filenames: false