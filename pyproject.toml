[project]
name = "dental-voice-agent"
version = "0.1.0"
description = "AI-powered voice receptionist for a simulated dental clinic."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "arize-phoenix>=22.0.0",
    "arize-phoenix-otel>=0.17.3",
    "fastapi>=0.162.5",
    "openai>=3.52.0",
    "openinference-instrumentation-openai>=0.1.75",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dental_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not manual'"
markers = [
    "manual: tests that should only run manually",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
omit = ["*/seed.py"]

[[tool.mypy.overrides]]
module = ["phoenix.*", "openinference.*"]
ignore_missing_imports = true
