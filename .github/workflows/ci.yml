name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cases:
        description: "Smoke cases to run against the real model (0 skips the evals job)"
        type: choice
        options: ["0", "1", "10", "40"]
        default: "10"
      pace_seconds:
        description: "Minimum seconds between model calls (raise it if you hit rate limits)"
        type: string
        default: "7"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: install dependencies
        run: uv sync --locked

      - name: run ruff
        run: uv run ruff check .

      - name: run mypy
        run: uv run mypy src tests

      - name: run pytest
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  evals:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.cases != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: evals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv sync --locked
      - run: uv run python evals/run_evals.py --smoke --no-judge --limit "$CASES"
        env:
          CASES: ${{ inputs.cases }}
          EVAL_PACE_S: ${{ inputs.pace_seconds }}
          EVAL_TURN_PAUSE_S: "5"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: keep transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.jsonl
          if-no-files-found: ignore